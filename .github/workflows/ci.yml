name: CI

on:
  push:
    branches: [main, develop, "refactor/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and typed-module checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --no-fix src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Type-check named typed modules
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,io,plot]"
      - name: Run complete test suite
        run: pytest -q --junitxml=/tmp/test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: /tmp/test-results.xml
          if-no-files-found: error

  physics:
    name: Physics and numerical contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,io,plot]"
      - name: Run physics and contract tests
        run: pytest -q tests/physics tests/contracts --junitxml=/tmp/physics-results.xml
      - name: Upload physics results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-results
          path: /tmp/physics-results.xml
          if-no-files-found: error
      - name: Upload benchmark references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baselines
          path: benchmarks/*.json
          if-no-files-found: error

  coverage:
    name: Branch coverage (minimum 47%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and coverage dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,io,plot]"
      - name: Measure and enforce branch coverage
        run: |
          coverage run --data-file=/tmp/rve-coverage --source=src/rovibrational_excitation --branch -m pytest -q
          coverage report --data-file=/tmp/rve-coverage --show-missing --fail-under=47 | tee /tmp/coverage-report.txt
          coverage xml --data-file=/tmp/rve-coverage -o /tmp/coverage.xml
      - name: Add coverage summary
        if: always()
        run: |
          echo '## Branch coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/coverage-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            /tmp/coverage-report.txt
            /tmp/coverage.xml
          if-no-files-found: error

  build:
    name: Build and clean-wheel import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build and inspect distributions
        run: |
          python -m build
          twine check dist/*
      - name: Install and import the wheel in a clean environment
        run: |
          python -m venv /tmp/rve-wheel-smoke
          /tmp/rve-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/rve-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/rve-wheel-smoke/bin/python -c "import rovibrational_excitation; print(rovibrational_excitation.__version__)"
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  required:
    name: Required CI gates
    if: always()
    needs: [quality, test, physics, coverage, build]
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed, skipped, or cancelled gates
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PHYSICS_RESULT: ${{ needs.physics.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$PHYSICS_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$BUILD_RESULT" = success
