name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify final tag and package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify final X.Y.Z version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ ! "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be a final X.Y.Z version"
            exit 1
          fi
          PROJECT_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [[ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "tag/package version mismatch: ${TAG_VERSION} != ${PROJECT_VERSION}"
            exit 1
          fi
          echo "version=${TAG_VERSION}" >> "${GITHUB_OUTPUT}"

  cpu-release-gates:
    name: CPU release gates
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,io,plot]"
      - name: Run quality gates
        run: |
          ruff check --no-fix src tests examples benchmarks scripts
          ruff format --check src tests examples benchmarks scripts
      - name: Run complete CPU suite
        run: pytest -q
      - name: Run supported examples and parameter template
        run: python scripts/smoke_examples.py

  typing-release-gate:
    name: Python 3.10 typing gate
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install typing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type-check named typed modules
        run: |
          python -m mypy --no-incremental 2>&1 | tee /tmp/mypy-output.txt
      - name: Annotate mypy failure
        if: failure()
        run: python scripts/report_ci_failures.py text "mypy failed" /tmp/mypy-output.txt

  gpu-validation:
    name: Real CUDA validation
    runs-on: [self-hosted, linux, x64, gpu]
    needs: verify-version
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with CUDA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,io,plot,gpu]"
      - name: Require a real CUDA device
        run: |
          python -c "import cupy as cp; count = cp.cuda.runtime.getDeviceCount(); assert count > 0, 'no CUDA device'; print(cp.cuda.runtime.getDeviceProperties(0)['name'])"
      - name: Run trusted NumPy/CuPy parity reference
        run: pytest -q tests/physics/test_two_level_reference.py::test_numpy_and_cupy_final_state_agree
      - name: Run all GPU-marked tests
        run: pytest -q -m gpu
      - name: Record synchronized real-CUDA evidence
        run: python benchmarks/run_cuda_evidence.py --output /tmp/rve-real-cuda-evidence.json
      - name: Upload real-CUDA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-cuda-evidence
          path: /tmp/rve-real-cuda-evidence.json
          if-no-files-found: error
          retention-days: 90

  container-validation:
    name: Development container smoke
    runs-on: ubuntu-latest
    needs: verify-version
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and exercise development container
        run: scripts/smoke_container.sh

  build-and-test:
    name: Build and clean-wheel verification
    runs-on: ubuntu-latest
    needs:
      - verify-version
      - cpu-release-gates
      - typing-release-gate
      - gpu-validation
      - container-validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install and import the wheel in a clean environment
        run: |
          python -m venv /tmp/rve-release-wheel
          /tmp/rve-release-wheel/bin/python -m pip install --upgrade pip
          /tmp/rve-release-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/rve-release-wheel/bin/python -c "import rovibrational_excitation; print(rovibrational_excitation.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Publish to PyPI with Trusted Publishing
    runs-on: ubuntu-latest
    needs: [verify-version, build-and-test]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/rovibrational-excitation/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  create-release:
    name: Create GitHub release after PyPI publication
    runs-on: ubuntu-latest
    needs: [verify-version, build-and-test, publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: real-cuda-evidence
          path: cuda-evidence/
      - name: Create release with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* cuda-evidence/*.json \
            --verify-tag \
            --generate-notes \
            --title "Release ${GITHUB_REF_NAME}"
