name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify final tag and package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify final X.Y.Z version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ ! "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be a final X.Y.Z version"
            exit 1
          fi
          PROJECT_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [[ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "tag/package version mismatch: ${TAG_VERSION} != ${PROJECT_VERSION}"
            exit 1
          fi
          echo "version=${TAG_VERSION}" >> "${GITHUB_OUTPUT}"

  cpu-release-gates:
    name: CPU release gates
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,io,plot]"
      - name: Run quality and typing gates
        run: |
          ruff check --no-fix src tests examples benchmarks scripts
          ruff format --check src tests examples benchmarks scripts
          mypy
      - name: Run complete CPU suite
        run: pytest -q
      - name: Run supported examples and parameter template
        run: python scripts/smoke_examples.py

  gpu-validation:
    name: Real CUDA validation
    runs-on: [self-hosted, linux, x64, gpu]
    needs: verify-version
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with CUDA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,io,plot,gpu]"
      - name: Require a real CUDA device
        run: |
          python -c "import cupy as cp; count = cp.cuda.runtime.getDeviceCount(); assert count > 0, 'no CUDA device'; print(cp.cuda.runtime.getDeviceProperties(0)['name'])"
      - name: Run trusted NumPy/CuPy parity reference
        run: pytest -q tests/physics/test_two_level_reference.py::test_numpy_and_cupy_final_state_agree
      - name: Run all GPU-marked tests
        run: pytest -q -m gpu

  build-and-test:
    name: Build and clean-wheel verification
    runs-on: ubuntu-latest
    needs: [verify-version, cpu-release-gates, gpu-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install and import the wheel in a clean environment
        run: |
          python -m venv /tmp/rve-release-wheel
          /tmp/rve-release-wheel/bin/python -m pip install --upgrade pip
          /tmp/rve-release-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/rve-release-wheel/bin/python -c "import rovibrational_excitation; print(rovibrational_excitation.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [verify-version, build-and-test]
    environment:
      name: pypi
      url: https://pypi.org/project/rovibrational-excitation/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  create-release:
    name: Create GitHub release after PyPI publication
    runs-on: ubuntu-latest
    needs: [verify-version, build-and-test, publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Create release with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Release ${GITHUB_REF_NAME}"
