system:
  type: viblad
  params:
    V_max: 3
    omega_cm: 2349.1
    delta_omega_cm: 25.0
    input_units: "cm^-1"
    output_units: "rad/fs"
    mu0: 0.3
    unit_dipole: "D"
    potential_type: harmonic
states:
  initial: [0]
  target: [3]
time:
  total_fs: 500.0
  field_dt_fs: 0.05
  output_stride: 1
algorithm:
  selected: krotov
algorithms:
  krotov:
    max_iter: 1000
    convergence_tol: 1.0e-18
    lambda_a: 1.0e-20
    target_fidelity: 1.0
    control_axes: "zx"
    initial_field_kind: generated
    initial_carrier_frequency: 2300.0
    initial_carrier_frequency_units: "cm^-1"
    initial_amplitude: 1.0e+9
    initial_amplitude_units: "V/m"
    initial_polarization: [1.0, 0.0]
    initial_duration: 200.0
    initial_duration_units: "fs"
    initial_center: 250.0
    initial_center_units: "fs"
plot:
  save_fig: false
  spectrum: false
  spectrogram: false
output:
  dir: "benchmarks/results"
